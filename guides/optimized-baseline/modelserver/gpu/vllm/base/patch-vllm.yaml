apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 8
  template:
    spec:
      containers:
        - name: modelserver
          command: ["bash", "-c"]
          # For distributed tracing, add to LLMD_EXTRA_VLLM_ARGS:
          #   --otlp-traces-endpoint=http://otel-collector:4317
          #   --collect-detailed-traces=all
          args:
            - |
              ${LLMD_PRE_START_COMMAND:+$LLMD_PRE_START_COMMAND &&} \
              exec vllm serve Qwen/Qwen3-32B \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --tensor-parallel-size=2 \
                --gpu-memory-utilization=0.95 \
                ${LLMD_EXTRA_VLLM_ARGS}
          # env:
          #   # Uncomment for distributed tracing env vars
          #   - name: OTEL_SERVICE_NAME
          #     value: "vllm-decode"
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: "http://otel-collector:4317"
          #   - name: OTEL_TRACES_EXPORTER
          #     value: "otlp"
          #   - name: OTEL_TRACES_SAMPLER
          #     value: "parentbased_traceidratio"
          #   - name: OTEL_TRACES_SAMPLER_ARG
          #     value: "0.1"
          resources:
            limits:
              cpu: '16'
              memory: 128Gi
              nvidia.com/gpu: 2
            requests:
              cpu: '8'
              memory: 96Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /preflight
              name: preflight-scripts
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: preflight-scripts
          configMap:
            name: llm-d-preflight-checks
            defaultMode: 0755
            optional: true
