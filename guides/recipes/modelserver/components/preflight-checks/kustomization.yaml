apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - configmap.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLMD_PRE_START_COMMAND
          value: "python3 /preflight/llm-d-preflight-checks.py"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLMD_PREFLIGHT_CHECKS
          value: "pause"
